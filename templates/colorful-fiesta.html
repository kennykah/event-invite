<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation - Colorful fiesta</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      background: #fff7ed;
      color: #1f2937;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: #6b7280;
      font-size: 1rem;
    }
    .details {
      text-align: center;
      margin: 32px 0;
    }
    .details div {
      margin: 14px 0;
      font-size: 1.1rem;
    }
    .details label {
      display: block;
      font-size: 0.75rem;
      color: #9ca3af;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .cta {
      text-align: center;
      margin-top: 32px;
    }
    .cta a {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(90deg, #ef4444, #f59e0b);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #6b7280;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p>🎉 Une fête, une date, une équipe</p>
      <h1>NAMES</h1>
      <p>Mariage</p>
    </div>
    <div class="details">
      <div>
        <label>Date</label>
        <span>DATE</span>
      </div>
      <div>
        <label>Heure</label>
        <span>TIME</span>
      </div>
      <div>
        <label>Lieu</label>
        <span>VENUE</span>
      </div>
      <div>
        <label>Invités</label>
        <span>GUEST_COUNT</span>
      </div>
    </div>
    <div class="cta">
      <a href="#">Confirmer ma présence</a>
    </div>
    <div class="footer">
      <p>Joie, couleurs, souvenirs</p>
    </div>
  </div>
</body>
</html>
