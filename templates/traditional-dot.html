<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation - Traditional dot</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      background: #1f1a17;
      color: #fdf6e3;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #f5c542;
      margin-bottom: 8px;
    }
    .header p {
      color: #f3e9d2;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }
    .details {
      text-align: center;
      margin: 32px 0;
    }
    .details div {
      margin: 14px 0;
      font-size: 1.1rem;
    }
    .details label {
      display: block;
      font-size: 0.75rem;
      color: #d6c99a;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .footer {
      text-align: center;
      margin-top: 48px;
      color: #d6c99a;
      font-size: 0.9rem;
    }
    .cta {
      margin-top: 32px;
      text-align: center;
    }
    .cta a {
      display: inline-block;
      padding: 12px 32px;
      background: #f5c542;
      color: #1f1a17;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p>Bureau de la famille</p>
      <h1>NAMES</h1>
      <p>Dot / Cérémonie traditionnelle</p>
    </div>
    <div class="details">
      <div>
        <label>Date</label>
        <span>DATE</span>
      </div>
      <div>
        <label>Heure</label>
        <span>TIME</span>
      </div>
      <div>
        <label>Lieu</label>
        <span>VENUE</span>
      </div>
      <div>
        <label>Convives</label>
        <span>GUEST_COUNT</span>
      </div>
    </div>
    <div class="cta">
      <a href="#">Confirmer ma présence</a>
    </div>
    <div class="footer">
      <p>Matanza / Bukɔtɔ — Famille, respect, célébration</p>
    </div>
  </div>
</body>
</html>
