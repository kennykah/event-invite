<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation - Classic gold</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Playfair Display', serif;
      min-height: 100vh;
      background: #faf3d9;
      color: #3e2723;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }
    .ornament {
      font-size: 2rem;
      color: #bfa030;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2.5rem;
      color: #3e2723;
      margin-bottom: 8px;
    }
    .subtitle {
      font-family: 'Open Sans', sans-serif;
      color: #8d6e63;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .details {
      margin: 40px 0;
    }
    .details div {
      margin: 16px 0;
    }
    .details label {
      display: block;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.75rem;
      color: #bfa030;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .details span {
      font-size: 1.25rem;
    }
    .cta a {
      display: inline-block;
      padding: 14px 36px;
      background: #bfa030;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-family: 'Open Sans', sans-serif;
      font-weight: 600;
    }
    .footer {
      margin-top: 48px;
      color: #8d6e63;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ornament">❦ ❦ ❦</div>
    <p class="subtitle">Vous êtes cordialement invité</p>
    <h1>NAMES</h1>
    <p class="subtitle">Mariage</p>
    <div class="details">
      <div>
        <label>Date</label>
        <span>DATE</span>
      </div>
      <div>
        <label>Heure</label>
        <span>TIME</span>
      </div>
      <div>
        <label>Lieu</label>
        <span>VENUE</span>
      </div>
      <div>
        <label>Invités</label>
        <span>GUEST_COUNT</span>
      </div>
    </div>
    <div class="cta">
      <a href="#">Confirmer ma présence</a>
    </div>
    <div class="footer">
      <p>Avec tout notre amour</p>
    </div>
  </div>
</body>
</html>
