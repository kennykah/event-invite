<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation - Modern dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .header p {
      color: #94a3b8;
      font-size: 1rem;
    }
    .details {
      text-align: center;
      margin: 32px 0;
    }
    .details div {
      margin: 14px 0;
      font-size: 1.1rem;
    }
    .details label {
      display: block;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .cta {
      text-align: center;
      margin-top: 32px;
    }
    .cta a {
      display: inline-block;
      padding: 14px 36px;
      background: #f8fafc;
      color: #0f172a;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p>EVENT</p>
      <h1>NAMES</h1>
      <p>Mariage</p>
    </div>
    <div class="details">
      <div>
        <label>Date</label>
        <span>DATE</span>
      </div>
      <div>
        <label>Heure</label>
        <span>TIME</span>
      </div>
      <div>
        <label>Lieu</label>
        <span>VENUE</span>
      </div>
      <div>
        <label>Invités</label>
        <span>GUEST_COUNT</span>
      </div>
    </div>
    <div class="cta">
      <a href="#">Confirmer ma présence</a>
    </div>
    <div class="footer">
      <p>— soirée privée —</p>
    </div>
  </div>
</body>
</html>
